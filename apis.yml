name: Cinchy
description: >-
  Cinchy is a data collaboration ("dataware") platform whose network-based data
  architecture lets enterprise applications share live, governed data without making
  copies or building point-to-point integrations. Its current focus, PeriMind, is an
  enterprise control plane for AI that secures, governs, and audits every interaction
  between AI agents and enterprise systems, data, and applications. Cinchy exposes a
  REST API for executing Cinchy Query Language (CQL), calling versioned saved queries,
  triggering data-sync jobs, and managing secrets, with authentication via bearer
  tokens, personal access tokens, HTTP Basic, and an embedded OAuth2/OIDC IdentityServer.
  Official Angular and JavaScript SDKs and embeddable app experiences are published on
  GitHub. Cinchy was surfaced as a Techstars portfolio company.
